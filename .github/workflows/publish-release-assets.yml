name: Publish SceneForge release assets

on:
  push:
    branches:
      - main
    paths:
      - module.json
      - README.md
      - scripts/**
      - styles/**
      - templates/**
      - .github/workflows/publish-release-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag from module version
        id: release_meta
        run: |
          TAG="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('module.json','utf8')); process.stdout.write(String(m.version||'').trim());")"
          if [ -z "$TAG" ]; then
            echo "module.json version is empty"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Build module ZIP at repository root layout
        run: |
          zip -r "SceneForge-AI.zip" module.json README.md scripts styles templates

      - name: Create or update GitHub release assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.release_meta.outputs.tag }}
          name: SceneForgeAI ${{ steps.release_meta.outputs.tag }}
          artifacts: |
            module.json
            SceneForge-AI.zip
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
